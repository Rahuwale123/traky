services:
  postgres:
    image: postgres:16
    container_name: traky-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: traky
      POSTGRES_PASSWORD: traky
      POSTGRES_DB: traky
    ports:
      - "5442:5432"
    volumes:
      - traky_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traky -d traky"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: traky-redis
    restart: unless-stopped
    ports:
      - "6389:6379"
    volumes:
      - traky_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  traky_postgres_data:
  traky_redis_data:
